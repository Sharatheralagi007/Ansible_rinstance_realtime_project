---
- name: Stop instance
  hosts: localhost
  connection: local

  tasks:
    - name: Stop EC2 instances using tag
      amazon.aws.ec2_instance:
        state: stopped
        filters:
          "tag:environment": "{{ item }}"
        region: us-east-1
        aws_access_key: "{{ ec2_access_key }}"
        aws_secret_key: "{{ ec2_secret_key }}"
      loop:
        - Ec2_linux_node
        - Ec2_ubuntu_node1
        - Ec2_ubuntu_node2

